# Static analysis configuration for Budget Manager.
# Base rules come from flutter_lints; the additions below enforce the project's
# architecture and money-safety conventions (see docs/architecture.md).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/firebase/firebase_options.dart" # generated by `flutterfire configure`
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error

linter:
  rules:
    # Style
    - prefer_single_quotes
    - always_declare_return_types
    - require_trailing_commas
    - sort_constructors_first
    - directives_ordering
    - prefer_relative_imports # inside lib/, use relative imports for own files
    - avoid_print # use core/utils/app_logger.dart
    # Correctness / safety
    - always_put_required_named_parameters_first
    - avoid_dynamic_calls
    - avoid_catches_without_on_clauses
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
    # Performance / hygiene
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - unnecessary_lambdas
    - use_super_parameters
