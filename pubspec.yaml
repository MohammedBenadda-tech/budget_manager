name: budget_manager
description: >-
  Budget Manager - an offline-first personal finance app (Arabic / RTL,
  default currency DZD) for Android and Windows. Currently an architecture
  scaffold: no application code has been implemented yet.
publish_to: "none"
version: 0.1.0+1

environment:
  # Conservative lower bound. Firebase plugins (Flutter BoM 5.1.0) need
  # Dart ^3.6 / Flutter >=3.27; Riverpod 3.x needs a newer Dart. `flutter pub get`
  # will report the real minimum - raise this to match the SDK you installed.
  sdk: ^3.8.0

# ---------------------------------------------------------------------------
# Version provenance (checked 2026-11-22 against pub.dev / Firebase release
# notes; `flutter pub get` has NOT been run on this scaffold - run it first and
# then `flutter pub outdated`):
#   verified : firebase_core, firebase_auth, cloud_firestore (Firebase Flutter
#              BoM 5.1.0, 2026-10-22), flutter_riverpod 3.4.1, drift 2.35.x,
#              fl_chart 1.2.0, go_router 18.1.1 (pub.dev API snapshot)
#   likely   : drift_flutter 0.3.1, build_runner 2.15.1, uuid 4.6.0
#              (Dependabot bumps, Jul 2026 - newer versions may exist)
#   unverified: drift_dev (assumed to track drift's version), connectivity_plus
#              (7.x confirmed to exist; exact latest not confirmed),
#              flutter_lints 6.x
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Date / number formatting + Arabic locale data. Version is pinned by
  # flutter_localizations, so `any` is the documented way to depend on it.
  intl: any

  # --- State management + dependency injection -----------------------------
  flutter_riverpod: ^3.4.1

  # --- Routing -------------------------------------------------------------
  go_router: ^18.1.1

  # --- Local database (SQLite via Drift; Android + Windows supported) ------
  drift: ^2.35.0
  drift_flutter: ^0.3.1 # opens the DB on every native platform

  # --- Firebase (imports are allowed ONLY under lib/firebase/) -------------
  # NOTE: Windows support for these plugins is beta / development-only.
  # See docs/firebase_setup.md.
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

  # --- Connectivity monitoring (Windows implementation is bundled) ---------
  connectivity_plus: ^7.1.0

  # --- Charts --------------------------------------------------------------
  fl_chart: ^1.2.0

  # --- Offline-safe unique IDs (UUID v7 is time-sortable) ------------------
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Arabic font: add your licensed/open-source font files to assets/fonts/ and
  # declare them here (e.g. Cairo or Tajawal). Left commented out so the
  # scaffold does not reference files that do not exist yet.
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
